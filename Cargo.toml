[package]
name = "squerk"
version = "0.1.0"
edition = "2021"
description = "Comment-driven merge bot (Rultor-like)"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[lib]
name = "squerk"
path = "src/lib.rs"

[[bin]]
name = "0squerk"
path = "src/main.rs"
